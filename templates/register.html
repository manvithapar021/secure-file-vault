{% extends "base.html" %}
{% block title %}Register — Secure File Vault{% endblock %}
{% block content %}
<h2>Register</h2>
<p class="text-muted">Your password is hashed — it is never stored in plain text.</p>
<form method="post" class="col-md-5">
  <div class="mb-3"><label class="form-label">Username</label>
    <input class="form-control" name="username" required minlength="3"></div>
  <div class="mb-3"><label class="form-label">Password</label>
    <input class="form-control" type="password" name="password" required minlength="6"></div>
  <button class="btn btn-primary">Create account</button>
</form>
{% endblock %}
